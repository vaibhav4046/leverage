<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill</title>
<style>
  :root {
    --bg: #0f1013;
    --panel: #15171b;
    --panel-2: #1b1e24;
    --edge: #262a33;
    --ink: #eceef2;
    --muted: #9297a3;
    --accent: #8b7cf6;
    --accent-ink: #ffffff;
    --user: #24272f;
    --radius: 14px;
    --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

  aside#sidebar { background: var(--panel); border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #5ec8ff); display: grid; place-items: center; color: #fff; font-size: 14px; }
  #new-chat { margin: 6px 14px 10px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel-2); color: var(--ink); font: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; transition: border-color 150ms, background 150ms; }
  #new-chat:hover { border-color: var(--accent); background: #1f2230; }
  .section { padding: 10px 18px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  #conversation-list { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; flex: 1; }
  #conversation-list li { padding: 9px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  #conversation-list li:hover { background: var(--panel-2); color: var(--ink); }
  #conversation-list li.active { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
  .me { padding: 14px 18px; border-top: 1px solid var(--edge); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #2c3140; display: grid; place-items: center; color: var(--ink); font-size: 12px; font-weight: 600; }

  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  header#topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; border-bottom: 1px solid var(--edge); background: rgba(15, 16, 19, 0.92); backdrop-filter: blur(8px); }
  #title { font-weight: 600; letter-spacing: -0.01em; }
  #model-badge { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; }
  #model-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15); }

  #messages { overflow-y: auto; padding: 28px 0 12px; }
  .thread { max-width: 760px; margin: 0 auto; padding: 0 22px; display: flex; flex-direction: column; gap: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0 20px; animation: rise 400ms ease-out both; }
  .empty h2 { margin: 0 0 6px; font-size: 26px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }
  .empty p { margin: 0; }
  .message { display: flex; gap: 12px; }
  .message .who { flex: 0 0 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .message .body { max-width: 640px; border-radius: var(--radius); padding: 12px 16px; }
  .user { flex-direction: row-reverse; }
  .user .who { background: var(--user); color: var(--ink); }
  .user .body { background: var(--user); border-bottom-right-radius: 4px; }
  .assistant { align-items: flex-start; }
  .assistant .who { background: var(--accent); color: var(--accent-ink); }
  .assistant .body { background: var(--panel); border: 1px solid var(--edge); border-bottom-left-radius: 4px; }
  .body p { margin: 0 0 10px; }
  .body p:last-child { margin: 0; }
  .body pre { margin: 10px 0; padding: 12px; border-radius: 10px; background: #0b0c0f; border: 1px solid var(--edge); overflow-x: auto; font-family: var(--mono); font-size: 13px; }
  .body code { font-family: var(--mono); font-size: 13px; background: #0b0c0f; padding: 1px 5px; border-radius: 5px; }
  .body pre code { padding: 0; background: none; }
  .body ul { margin: 6px 0 10px; padding-left: 20px; }
  .body strong { font-weight: 600; }

  #typing { display: none; align-items: center; gap: 12px; }
  #typing.on { display: flex; }
  .typing { display: inline-flex; gap: 5px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius); border-bottom-left-radius: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }

  .composer-wrap { padding: 12px 22px 18px; }
  form#composer { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 10px 10px 16px; transition: border-color 150ms, box-shadow 150ms; }
  form#composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 124, 246, 0.18); }
  #input { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; line-height: 1.5; max-height: 200px; padding: 6px 0; }
  #input::placeholder { color: var(--muted); }
  #send { width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; transition: transform 120ms, opacity 150ms; }
  #send:hover { transform: translateY(-1px); }
  #send:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  #error { max-width: 760px; margin: 8px auto 0; color: #f87171; font-size: 13px; display: none; }

  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside#sidebar { display: none; }
    .message .body { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar" aria-label="Conversations">
    <div class="brand"><span class="mark">Q</span>Quill</div>
    <button id="new-chat" type="button"><span>+</span> New chat</button>
    <div class="section">Recent</div>
    <ul id="conversation-list"></ul>
    <div class="me"><span class="avatar">V</span><span>Workspace · local</span></div>
  </aside>
  <main>
    <header id="topbar">
      <div id="title">New chat</div>
      <span id="model-badge">loading model</span>
    </header>
    <div id="messages">
      <div class="thread" id="thread">
        <div class="empty" id="empty"><h2>What are we working on?</h2><p>Ask anything. Replies come from the model named in the badge; nothing leaves this machine.</p></div>
        <div class="message assistant" id="typing"><div class="who">Q</div><div class="typing"><i></i><i></i><i></i></div></div>
      </div>
    </div>
    <div class="composer-wrap">
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message Quill" aria-label="Message"></textarea>
        <button id="send" type="submit" aria-label="Send">&#10148;</button>
      </form>
      <div id="error" role="alert"></div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>
</div>
<script src="./shim.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const state = { conversationId: null, conversations: [] };
  const list = $('#conversation-list'), thread = $('#thread'), typing = $('#typing'), empty = $('#empty');
  const form = $('#composer'), input = $('#input'), send = $('#send'), errorBox = $('#error'), title = $('#title'), badge = $('#model-badge');

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; setTimeout(() => { errorBox.style.display = 'none'; }, 6000); }
  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  // A small, safe renderer: fenced code, inline code, bold, bullet lists, paragraphs.
  function renderMarkdown(text) {
    const parts = text.split(/```/);
    return parts.map((part, i) => {
      if (i % 2 === 1) { const body = part.replace(/^[a-z]*\n/, ''); return '<pre><code>' + escapeHtml(body) + '</code></pre>'; }
      return part.split(/\n{2,}/).filter((p) => p.trim()).map((p) => {
        const lines = p.split('\n');
        if (lines.every((l) => /^\s*[-*] /.test(l))) return '<ul>' + lines.map((l) => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
        return '<p>' + lines.map(inline).join('<br>') + '</p>';
      }).join('');
    }).join('');
  }
  function inline(s) { return escapeHtml(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

  function appendMessage(role, content) {
    empty.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.innerHTML = '<div class="who">' + (role === 'user' ? 'Y' : 'Q') + '</div><div class="body">' + (role === 'assistant' ? renderMarkdown(content) : '<p>' + escapeHtml(content).replace(/\n/g, '<br>') + '</p>') + '</div>';
    thread.insertBefore(div, typing);
    $('#messages').scrollTop = $('#messages').scrollHeight;
  }
  function setTyping(on) { typing.classList.toggle('on', on); if (on) $('#messages').scrollTop = $('#messages').scrollHeight; }
  function clearThread() { thread.querySelectorAll('.message:not(#typing)').forEach((n) => n.remove()); empty.style.display = ''; }

  function renderList() {
    list.innerHTML = '';
    for (const c of state.conversations) {
      const li = document.createElement('li');
      li.textContent = c.title || 'New chat';
      li.className = c.id === state.conversationId ? 'active' : '';
      li.onclick = () => openConversation(c.id);
      list.appendChild(li);
    }
  }

  async function loadConversations() {
    try {
      const res = await fetch('/api/conversations');
      if (res.ok) { state.conversations = await res.json(); renderList(); }
    } catch (e) { /* the list is a convenience; the chat still works */ }
  }

  async function loadModel() {
    try {
      const res = await fetch('/api/models');
      if (res.ok) { const m = await res.json(); badge.textContent = m.default || (m.models && m.models[0]) || 'model'; return; }
    } catch (e) { /* older server without a models route */ }
    badge.textContent = 'local model';
  }

  async function newConversation() {
    const res = await fetch('/api/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (!res.ok) throw new Error('Could not start a conversation');
    const conv = await res.json();
    state.conversationId = conv.id;
    clearThread();
    title.textContent = conv.title || 'New chat';
    await loadConversations();
  }

  async function openConversation(id) {
    const res = await fetch('/api/conversations/' + id);
    if (!res.ok) return showError('That conversation is gone');
    const conv = await res.json();
    state.conversationId = conv.id;
    clearThread();
    title.textContent = conv.title || 'New chat';
    for (const m of conv.messages || []) appendMessage(m.role, m.content);
    renderList();
  }

  async function sendMessage(text) {
    if (!state.conversationId) await newConversation();
    appendMessage('user', text);
    setTyping(true);
    send.disabled = true;
    try {
      const res = await fetch(`/api/conversations/${state.conversationId}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: text }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('The model did not answer (' + res.status + ')'));
      appendMessage('assistant', body.reply.content || '');
      if (title.textContent === 'New chat') title.textContent = text.slice(0, 48);
      await loadConversations();
    } catch (err) {
      showError(err.message);
    } finally {
      setTyping(false);
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); const text = input.value.trim(); if (!text) return; input.value = ''; input.style.height = 'auto'; sendMessage(text); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; });
  $('#new-chat').addEventListener('click', () => newConversation().catch((e) => showError(e.message)));

  loadModel();
  newConversation().catch((e) => showError(e.message));
</script>
</body>
</html>
